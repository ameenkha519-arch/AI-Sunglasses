
<script>
const file = document.getElementById("file");
const photo = document.getElementById("photo");
const placeholder = document.getElementById("placeholder");
const statusText = document.getElementById("status");

file.addEventListener("change", function () {
  const selected = file.files[0];

  if (!selected) return;

  if (!selected.type.startsWith("image/")) {
    statusText.textContent = "Please select an image.";
    return;
  }

  photo.src = URL.createObjectURL(selected);
  photo.style.display = "block";
  placeholder.style.display = "none";
  statusText.textContent = "Photo uploaded successfully!";
});

document.querySelectorAll(".actions button").forEach(function (button) {
  button.addEventListener("click", function () {
    const style = button.textContent.trim();

    if (style === "Reset") {
      photo.removeAttribute("src");
      photo.style.display = "none";
      placeholder.style.display = "block";
      file.value = "";
      statusText.textContent = "Choose a photo to begin.";
      return;
    }

    statusText.textContent = style + " style selected. Virtual fitting is coming soon.";
  });
});
</script>
