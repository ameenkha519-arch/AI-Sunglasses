
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunglasses AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f5f7ff;font-family:Arial,sans-serif;text-align:center}
header{padding:22px;border-bottom:1px solid #26354a;font-size:22px;font-weight:bold}
header span,h1 span{color:#45b8ff}
main{max-width:850px;margin:auto;padding:65px 20px}
h1{font-size:clamp(38px,7vw,65px);margin-bottom:15px}
p{color:#aab5c8;line-height:1.7}
.studio{background:#111827;border:1px solid #26354a;border-radius:20px;padding:20px;margin-top:35px}
.preview{position:relative;background:#080d17;min-height:260px;border:1px dashed #36516e;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#photo{display:none;width:100%;height:auto}
#placeholder{padding:25px}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:18px}
button,.upload{background:#172438;color:white;border:1px solid #34516d;border-radius:9px;padding:13px 18px;cursor:pointer}
.primary{background:#1689d0}
input{display:none}
#status{color:#45b8ff;margin-top:20px}
footer{padding:30px;color:#718096}
</style>
</head>
<body>
<header>SUNGLASSES<span> AI.</span></header>
<main>
<p>YOUR STYLE. YOUR EXPERIENCE.</p>
<h1>Find Your <span>Perfect Look.</span></h1>
<p>Upload your photo and explore your next sunglasses style.</p>

<section class="studio">
<div class="preview">
<p id="placeholder">Your photo will appear here</p>
<img id="photo" alt="Uploaded photo">
</div>

<div class="actions">
<label class="upload" for="file">Upload Photo</label>
<input type="file" id="file" accept="image/*">
<button onclick="resetPhoto()">Reset</button>
</div>

<div class="actions">
<button onclick="choose('Aviator')">Aviator</button>
<button onclick="choose('Wayfarer')">Wayfarer</button>
<button onclick="choose('Round')">Round</button>
<button onclick="choose('Sport')">Sport</button>
</div>
<p id="status">Choose a photo to begin.</p>
</section>
</main>
<footer>SUNGLASSES AI. — Discover Your Style</footer>

<script>
const file=document.getElementById("file");
const photo=document.getElementById("photo");
const placeholder=document.getElementById("placeholder");
const statusText=document.getElementById("status");

file.addEventListener("change",()=>{
 const selected=file.files[0];
 if(!selected)return;
 if(!selected.type.startsWith("image/")){
  statusText.textContent="Please select an image.";
  return;
 }
 photo.src=URL.createObjectURL(selected);
 photo.style.display="block";
 placeholder.style.display="none";
 statusText.textContent="Photo uploaded successfully!";
});

function choose(style){
 statusText.textContent=style+" style selected. Virtual fitting is coming soon.";
}

function resetPhoto(){
 photo.removeAttribute("src");
 photo.style.display="none";
 placeholder.style.display="block";
 file.value="";
 statusText.textContent="Choose a photo to begin.";
}
</script>
</body>
</html>
